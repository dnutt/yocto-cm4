# ─────────────────────────────────────────────────────────────────────────────
# bblayers.conf — BitBake layer configuration for Raspberry Pi CM4
# Yocto release: Scarthgap (5.0 LTS)
#
# All paths are absolute inside the container (/workspace).
# The workspace/ directory is bind-mounted from the host so these paths
# remain consistent regardless of where the project lives on the host.
# ─────────────────────────────────────────────────────────────────────────────

# Increment this when making incompatible changes to bblayers.conf format.
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

BBLAYERS ?= " \
    /workspace/poky/meta \
    /workspace/poky/meta-poky \
    /workspace/poky/meta-yocto-bsp \
    \
    /workspace/meta-openembedded/meta-oe \
    /workspace/meta-openembedded/meta-python \
    /workspace/meta-openembedded/meta-networking \
    \
    /workspace/meta-raspberrypi \
    "

# ─── Layer notes ─────────────────────────────────────────────────────────────
# meta                  core OE recipes (gcc, glibc, busybox, …)
# meta-poky             Poky distro configuration
# meta-yocto-bsp        reference BSPs (qemu, beaglebone, …) — kept for completeness
# meta-oe               extended package set (libs, tools, utilities)
# meta-python           Python 3 packages and modules
# meta-networking       dhcpcd, iproute2, openssh, wpa-supplicant, …
# meta-raspberrypi      RPi machine definitions (raspberrypi4-64 covers the CM4), GPU firmware, kernel config
