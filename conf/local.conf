# ─────────────────────────────────────────────────────────────────────────────
# local.conf — Yocto build configuration for Raspberry Pi CM4
# Yocto release: Scarthgap (5.0 LTS)
#
# This file is installed by setup.sh into build/conf/local.conf.
# Edit it before (or after) running setup.sh to change build options.
# ─────────────────────────────────────────────────────────────────────────────

# ─── Target machine ──────────────────────────────────────────────────────────
# The CM4 shares the BCM2711 SoC with the Pi 4, so meta-raspberrypi uses the
# same machine definition for both. raspberrypi4-64 builds a 64-bit aarch64 image.
# CM4-specific hardware (PCIe, eMMC) is configured via device tree overlays at
# runtime, not through a separate machine config.
MACHINE = "raspberrypi4-64"

# ─── Distribution ────────────────────────────────────────────────────────────
# "poky" is the Yocto reference distro; it's a safe default for embedded work.
# Switch to "poky-tiny" for a stripped-down image, or create your own distro
# layer when you need more control over DISTRO_FEATURES.
DISTRO = "poky"

# ─── Package format ──────────────────────────────────────────────────────────
# rpm is the default. Alternatives: package_ipk (smaller, opkg), package_deb.
PACKAGE_CLASSES = "package_rpm"

# ─── Image features ──────────────────────────────────────────────────────────
# debug-tweaks: enables passwordless root login and other dev conveniences.
# Remove for production images.
EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

# ssh-server-openssh: installs and enables OpenSSH (sshd).
# Alternatively use "ssh-server-dropbear" for a smaller footprint.
IMAGE_FEATURES += "ssh-server-openssh"

# ─── Extra packages ──────────────────────────────────────────────────────────
# Networking utilities included in the base image.
# iproute2      – ip, ss, tc (replaces deprecated net-tools)
# dhcpcd        – lightweight DHCP client; handles eth0/wlan0 leases
# e2fsprogs     – filesystem tools (fsck, tune2fs)
# e2fsprogs-resize2fs – resize root partition on first boot
# util-linux    – mount, lsblk, fdisk, etc.
IMAGE_INSTALL:append = " \
    iproute2 \
    dhcpcd \
    e2fsprogs \
    e2fsprogs-resize2fs \
    util-linux \
"

# ─── Raspberry Pi BSP settings ───────────────────────────────────────────────
# ENABLE_UART: exposes the primary UART (PL011) on the 40-pin header GPIO14/15.
# Set to "0" if you don't need a serial console.
ENABLE_UART = "1"

# GPU_MEM: megabytes reserved for the VideoCore GPU firmware.
# 16 MB is the minimum; only increase if you need hardware video decode/encode
# or plan to run a framebuffer/Wayland compositor.
GPU_MEM = "16"

# RPI_USE_U_BOOT: uncomment to replace the RPi bootloader with U-Boot.
# Required if you want UEFI, verified boot, or a custom boot flow.
# RPI_USE_U_BOOT = "1"

# ENABLE_DWC2_PERIPHERAL: enables the USB-OTG gadget driver on the CM4's
# USB 2.0 port. Useful for USB-over-Ethernet (RNDIS/ECM) or serial gadgets.
# ENABLE_DWC2_PERIPHERAL = "1"

# ─── Wifi/BT firmware licence ────────────────────────────────────────────────
# The CM4 includes a CYW43455 WiFi/BT chip whose firmware requires accepting
# a Synaptics (formerly Cypress) licence. Uncomment to include WiFi support.
LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

# ─── Shared cache directories (mapped via Docker volumes) ────────────────────
# DL_DIR: downloaded source archives. Shared across Yocto projects/versions
# to avoid re-downloading the same tarballs.
DL_DIR = "/downloads"

# SSTATE_DIR: cached build artefacts (object files, packages, etc.).
# Sharing this dramatically speeds up incremental builds and layer upgrades.
SSTATE_DIR = "/sstate-cache"


# ─── Source mirror ────────────────────────────────────────────────────────────
# own-mirrors makes BitBake check SOURCE_MIRROR_URL before going to the internet.
# This means a second build (or a build on a different machine with the same
# mirror directory) can fetch everything locally without any network access.
INHERIT += "own-mirrors"
SOURCE_MIRROR_URL = "file:///mirror"

# Generate tarballs from SCM checkouts (git, svn, hg, etc.) and place them in
# DL_DIR alongside regular archives. Without this, git fetches are stored as
# bare repos which cannot be served as mirror tarballs. With it enabled,
# BitBake writes a <name>-<rev>.tar.gz next to every SCM download so the
# mirror directory contains a complete, self-contained source snapshot.
BB_GENERATE_MIRROR_TARBALLS = "1"

# ─── Parallelism ─────────────────────────────────────────────────────────────
# BitBake task parallelism: how many recipes build simultaneously.
BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"

# make parallelism: -j flag passed to each individual make invocation.
PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"

# ─── Disk space monitors ─────────────────────────────────────────────────────
# BitBake will pause (STOPTASKS) or abort (HALT) if free space falls below
# the specified thresholds. Tune based on your available disk.
# A full CM4 core-image-base build needs roughly 30–50 GB in TMPDIR.
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},2G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    HALT,${TMPDIR},500M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
"
